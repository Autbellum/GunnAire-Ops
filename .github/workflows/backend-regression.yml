
name: Backend regression

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            Backend/requirements.txt

      - name: Install canonical dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile backend modules
        run: python -m compileall -q Backend gunnaire_backend.py

      - name: Compile release and acceptance tools
        run: python -m compileall -q Tools

      - name: Run complete backend suite
        run: python -m unittest discover -s Backend -p 'test_*.py' -v

      - name: Run CloudKit, release, and signed-device tool suite
        run: python -m unittest discover -s Tools -p 'test_*.py' -v
