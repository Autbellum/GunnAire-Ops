name: Local AI and Firewall Tooling
on:
  pull_request:
    paths: ['Infrastructure/**', '.github/workflows/local-ai-firewall-tooling.yml']
  push:
    paths: ['Infrastructure/**', '.github/workflows/local-ai-firewall-tooling.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shell and JSON plans
        run: |
          bash -n Infrastructure/install-local-ai.sh
          python3 Infrastructure/validate-infrastructure.py
          python3 Infrastructure/validate-infrastructure.py --self-test
