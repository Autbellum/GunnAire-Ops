name: Local AI and Firewall Tooling

on:
  pull_request:
    paths:
      - 'LocalAI/**'
      - 'Firewall/**'
      - 'Verification/**'
      - 'Makefile'
      - '.github/workflows/local-ai-firewall-tooling.yml'
  push:
    branches: [main]
    paths:
      - 'LocalAI/**'
      - 'Firewall/**'
      - 'Verification/**'
      - 'Makefile'
      - '.github/workflows/local-ai-firewall-tooling.yml'

permissions:
  contents: read

jobs:
  deterministic-tests:
    # QA execution is intentionally fail-closed outside the macOS sandbox.
    # Linux backend and routing checks remain in their separate workflows.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify guarded local-AI and firewall tooling
        run: make verify
