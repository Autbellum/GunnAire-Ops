name: Local AI and Firewall Tooling

on:
  pull_request:
    paths:
      - 'LocalAI/**'
      - 'Firewall/**'
      - 'Synology/**'
      - 'IMPLEMENTATION_STATUS.md'
      - 'SOURCES.md'
      - 'Makefile'
      - '.github/workflows/local-ai-firewall-tooling.yml'
  push:
    branches: [main]
    paths:
      - 'LocalAI/**'
      - 'Firewall/**'
      - 'Synology/**'
      - 'IMPLEMENTATION_STATUS.md'
      - 'SOURCES.md'
      - 'Makefile'
      - '.github/workflows/local-ai-firewall-tooling.yml'

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify guarded local-AI, firewall, and reporting tooling
        run: make verify
